# Agent spec for 'reviewer' — a declarative, sovereign unit of work bound to
# one execution harness and budget. See `nool guide multi-agent` and
# docs/USER_GUIDE.md "Multi-Agent Orchestration (Souls, Agents, Fleets)".
#
# Validate:  nool agent validate agents/reviewer.yaml
# Run:       nool agent run --spec agents/reviewer.yaml --intent "<what to do>"

name: "reviewer"

# One-line summary shown by `nool agent list`, folded into this agent's
# system-prompt context when it runs.
description: "TODO: describe what this agent does"

executor:
  # Which backend runs this agent (`nool harness list` shows what's ready).
  # `host` needs no API key/credential and is always ready.
  harness: host
  # Model name/tag passed to the harness. For `host` this is only echoed
  # back, so any label works; other harnesses expect a real model id.
  model: inherited
  # Credential reference: `env:VAR_NAME` reads an env var at run time,
  # `oauth:<provider>` uses a stored OAuth token, or `none` (required for
  # `host`, which needs no credential).
  auth: none

# Optional: bind this agent to a persistent soul/persona (`nool soul list`)
# to inherit its charter and memory.
# soul: <soul-name>

# Least-privilege capability grants — empty by default; add only what this
# agent needs, e.g.:
#   tools:
#     - nool.query
#     - nool.propose
#     - fs.read
tools: []

budget:
  per_run_usd: 0.50        # hard USD ceiling for one run
  max_turns: 40             # hard turn ceiling for one run
  compaction_window: 120000 # tokens re-read before the run loop compacts context

policy:
  blast_radius_max: 15    # max NodeID-touch footprint this agent may propose
  on_overlap: lease         # lease | error — what to do on overlapping work
  trust_tier: 0              # 0 = least trusted; raise as this agent proves out
  # role: architect          # optional: bind to a steering role for role-pool dispatch
  # specialist: <name>       # optional: open-ended specialist tag for description-routing
  max_delegation_depth: 5    # cap on live agent-as-tool delegation chain depth

retry:
  max_retries: 3
  backoff_base_ms: 500
  jitter: true
