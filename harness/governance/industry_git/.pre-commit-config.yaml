# Pre-commit hygiene (industry: pre-commit.com framework)
# Advisory local checks mirroring the policy in POLICY.md; the blocking
# gates are the required checks (ci.yml) and secret scanning.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l .
        language: system
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        stages: [pre-push]
