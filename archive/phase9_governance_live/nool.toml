[aram]
policies_path = "policies/"
fuel_limit = 1000000000
memory_limit = 65536
strict_floats = true
require_full_paths = []
hooks = []

[bridge]
git_mirror_path = ".nool/git_mirror/"
sync_on_solidify = true
auto_push_remotes = []
use_host_repo = true
transport = "git"

[replay]
max_clock_skew_ms = 5000
strict_causality = true

[memory]
similarity_threshold = 0.7
embedding_model = "local"

[reification]
enabled = true
run_ghost_tests = true
cascade_reification = true
use_cow_acceleration = true

[analysis]
ast_enabled = true

[invariants]
disabled = false
rules = ["requires_doc"]

[blast_radius.trust_levels]
"internal/security/*" = "critical"
"internal/api/*" = "standard"
"main.go" = "low"

[gating]
fail_fast = true
relational_controls = "block"
wasm_policy_failure = "block"
blast_block_threshold = 30

[rules]
forbidden_paths = ["internal/security/auth.go"]

[features]
team_collaboration = true
peer_to_peer = true
task_management = true
auto_announce = true
