# Governance profile for the nool treatment arms of the fleet benchmark.
#
# Every section below is verified against the pinned CLI: the sections and
# keys are exactly those emitted by `nool init` / `nool config
# init-governance` for this version, and setup_ws() runs `nool verify
# --all` after writing this file, failing the run if the profile does not
# parse. The profile hash is recorded in every run record.
#
# Deliberately NOT included: policies/*.yaml Aram DSL rule files. Their
# schema (DslRuleFile) is not documented in the fetched docs or CLI help,
# and we refuse to ship policy code whose semantics we cannot verify.
# Secret scanning is therefore implemented as a symmetric harness-level
# gate (see fleet_run.secret_scan) applied identically to every arm —
# mirroring the gitleaks/trufflehog CI stage used in industry practice.
# Posture: observe-first (invariants warn); blocking reserved for the
# blast airlock and the shared secret gate.
#
# ARM-PARITY RULE (architect decision, 2026-09-06). A control belongs in
# this profile only if the git arms' control set contains a functional
# counterpart. The git arms receive ci.yml required checks (build+test),
# CODEOWNERS, POLICY.md and .pre-commit-config.yaml, plus the harness's
# symmetric secret gate; every one of those is either automatic or inert
# documentation. NOTHING in the git arms halts work pending a named human
# role's approval. An interactive steering checkpoint therefore has no
# counterpart, and including one puts a live blocking control on one side
# of the comparison only — which is what setup_ws's "the rules are held
# constant; only the enforcement substrate differs" contract forbids. The
# two steer points this profile used to declare are removed below for that
# reason, and the rule is symmetric: if the git arms ever gain a real
# approval gate, nool's comes back.
#
# Disclosure: removing a gate only the nool arms faced removes a handicap
# from nool. The justification is the parity rule stated above, not the
# direction of the effect; the rule was fixed before the change and does
# not depend on which arm it favors.

[gating]
fail_fast = true
wasm_policy_failure = "block"
blast_block_threshold = 30

[trust]
enabled = false

# Steering is DISABLED under the arm-parity rule above. It previously
# declared two interactive checkpoints: a CISO pre-push approval on
# sensitive paths, and an Architect pre-solidify approval on
# `coupling_slope_gt = 0.3`. Neither had a git-arm counterpart.
#
# The pre-solidify point was inert on every collected run (zero steering
# halts anywhere in results/trackc/fleet_runs.jsonl), then began firing on
# `nool try promote` under nool 7.2.0 — after reification reports full
# validation passed — taking nool_try from 8/8 to 3/8 on the scripted
# adapter while nool_fleet/nool_gated stayed at 8/8, because those
# integrate with `nool merge`, which the same declared policy does not
# bind. That non-uniform enforcement is reported as a product finding in
# its own right; it is not the reason for this change, and this change is
# not a workaround for it. The reason is arm parity, which held before
# 7.2.0 ever made the gate visible.
#
# Removing it is prospective-only: no collected result contains a steering
# halt, so no past number moves. The profile hash changes, which is how
# run records distinguish the two profiles (old
# 4e94f9c0a176e268f52024b38da57937b8f0d44fcd5acbb1e84bf9a0c96f2355).
# fleet_run.py keeps a permanent tripwire: any steering halt is classified
# `rejection_kind: "steer"` and disqualifies the RUN, never the ticket —
# ticket-level censoring would be invalid here, because
# `coupling_slope_gt` correlates with the contended-cluster tickets this
# study is about, so dropping halted tickets would preferentially remove
# the hardest ones and inflate the arm.
[steer]
enabled = false

# Advisory invariants: agents see the signal without hard style blocks;
# the measured gates remain conflicts, health, secrets, steering.
[invariants]
disabled = false
rules = []

# Aram gate: loads the DSL policy packs from policies/ (secret scanning).
# Without this section no policy directory is consulted at all.
[aram]
policies_path = "policies/"
fuel_limit = 1000000000
memory_limit = 16777216
strict_floats = true

[doctor]
release_branch_patterns = ["release/*", "hotfix/*"]
expect_release_on_release_branch = true
stale_task_days = 21
