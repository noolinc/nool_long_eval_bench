# Advisory pack: unlabelled high-entropy token candidates.
# mode=warning flags without blocking landing; deterministic test fixtures
# must never be hard-blocked by entropy heuristics.
# Note: uses the documented regex predicate rather than the built-in
# diff_has_high_entropy_secret helper, whose argument schema is not
# published in the docs; behaviour is verified empirically against the
# pinned CLI before every profile change.
rules:
  - inv_id: SECRET-ENTROPY-001
    title: "High-entropy blob in diff (possible unlabelled secret)"
    scope:
      type: global
    kind: structural
    severity: low
    mode: warning
    stages:
      - pre-solidify
    forbids:
      - any_of:
          - diff_matches: "[A-Za-z0-9+/]{60,}={0,2}"
          - diff_matches: "[a-f0-9]{64}"
