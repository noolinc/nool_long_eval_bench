# Blocking pack: credential material must never land.
# Schema per docs/policies: rules[] with inv_id/scope/kind/severity/mode/
# stages + forbids predicates; loaded automatically from policies_path.
rules:
  - inv_id: SECRET-AWS-001
    title: "AWS access key id in diff"
    scope:
      type: global
    kind: structural
    severity: critical
    mode: blocking
    stages:
      - pre-solidify
    forbids:
      - diff_matches: "AKIA[0-9A-Z]{16}"

  - inv_id: SECRET-GH-001
    title: "GitHub token in diff"
    scope:
      type: global
    kind: structural
    severity: critical
    mode: blocking
    stages:
      - pre-solidify
    forbids:
      - any_of:
          - diff_matches: "github_pat_[A-Za-z0-9_]{20,}"
          - diff_matches: "ghp_[A-Za-z0-9]{20,}"

  - inv_id: SECRET-APIKEY-001
    title: "API key material in diff"
    scope:
      type: global
    kind: structural
    severity: critical
    mode: blocking
    stages:
      - pre-solidify
    forbids:
      - any_of:
          - diff_matches: "sk-[A-Za-z0-9_-]{20,}"
          - diff_matches: "xox[baprs]-[A-Za-z0-9-]{10,}"

  - inv_id: SECRET-PEM-001
    title: "Private key header in diff"
    scope:
      type: global
    kind: structural
    severity: critical
    mode: blocking
    stages:
      - pre-solidify
    forbids:
      - diff_matches: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
